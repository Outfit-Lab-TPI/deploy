server {
    listen 80;
    server_name your_domain.com; # Reemplaza con tu dominio o IP

    # Sirve el frontend
    location / {
        proxy_pass http://frontend_app; # Nombre del servicio en docker-compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirige las llamadas a la API al backend
    location /api/ {
        proxy_pass http://backend_app:8080; # Nombre del servicio y puerto interno
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
