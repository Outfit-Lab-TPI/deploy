# Configuración temporal de Nginx (sin HTTPS)
# Se usa mientras se obtienen los certificados SSL

server {
    listen 80;
    server_name outfitlab.com.ar www.outfitlab.com.ar;

    # Permite el desafío de Let's Encrypt para obtener certificados
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Sirve el frontend
    location / {
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirige las llamadas a la API al backend
    location /api/ {
        proxy_pass http://backend_app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
