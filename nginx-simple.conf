# Configuración simple de Nginx para acceso por IP (sin HTTPS)
# Usa este archivo si accedes solo por IP sin dominio

server {
    listen 80;
    # No especificamos server_name para aceptar cualquier IP

    # Sirve el frontend
    location / {
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirige las llamadas a la API al backend
    location /api/ {
        proxy_pass http://backend_app:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Headers adicionales para CORS (si es necesario)
        proxy_set_header Access-Control-Allow-Origin *;
    }
}
